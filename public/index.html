<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Adventures Ops</title>
<meta name="theme-color" content="#f25c0f">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"><div class="palm" data-palm="6"></div>
    <div class="brand"><img src="/logo.png" alt="Wild Adventures"><div><small>Al Badayer</small><b>OPS</b></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rolebox">
      <label for="role">Vue utilisateur</label>
      <select id="role" onchange="setRole(this.value)">
        <option value="owner">Direction — Mourad</option>
        <option value="manager">Manager</option>
        <option value="reception">Réception</option>
        <option value="guide">Guide — Calvin</option>
        <option value="mechanic">Mécanicien</option>
      </select>
      <div class="syncline"><span id="syncState" data-state="ok">Mode démo</span></div>
    </div>
  </aside>
  <div class="main"><div class="deco dots"></div><div class="deco dots l"></div><div class="deco palm-r palm" data-palm="7"></div>
    <header class="top">
      <button class="burger" onclick="toggleSide()" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="search"><svg class="ico"><use href="#i-search"/></svg><input id="q" placeholder="Client, téléphone, n° booking, véhicule…" oninput="topSearch(this)" onkeydown="if(event.key==='Enter'&&S.view!=='booking')doSearch(this.value)"></div>
      <div class="qa" id="qa"></div>
      <button class="bell" onclick="go('actions')" aria-label="Alertes"><svg class="ico"><use href="#i-bell"/></svg><i id="bellc">0</i></button>
      <div class="who"><div class="av m" id="av">M</div><span id="whoName"></span></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<button class="btn pri big fab" id="fab" onclick="newBooking()">+ BOOKING</button>
<div id="modal"></div>
<div id="tvwrap"></div>
<div id="toast"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></symbol>
  <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="9" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></symbol>
  <symbol id="i-live" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2 0 4 1.5 5 4"/></symbol>
  <symbol id="i-agent" viewBox="0 0 24 24"><path d="M3 7h18v12H3z"/><path d="M8 7V5h8v2M3 12h18"/></symbol>
  <symbol id="i-garage" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z"/><path d="M7 20v-6h10v6M7 17h10"/></symbol>
  <symbol id="i-fleet" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6M4 13l3-6h8l4 6M10 7v6"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14 6a4 4 0 005 5l-9 9-3-3 9-9a4 4 0 01-2-2z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></symbol>
  <symbol id="i-staff" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 21c1-5 4-7 7-7s6 2 7 7"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-7 8-7s7 2 8 7"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-car" viewBox="0 0 64 40"><path d="M6 26l6-12h26l10 8h8l2 6-4 4H6z" fill="currentColor" stroke="none"/><circle cx="16" cy="32" r="6" fill="#1a0f07" stroke="#f5d6ae" stroke-width="2"/><circle cx="48" cy="32" r="6" fill="#1a0f07" stroke="#f5d6ae" stroke-width="2"/><path d="M18 14l4-6h14l4 6" stroke="currentColor" stroke-width="3" fill="none"/></symbol>
</svg>
<div id="boot" class="boot"><img src="/logo.png" alt="" width="120"><span>Chargement…</span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/store.js"></script>
<script src="/app.js"></script>
</body>
</html>
